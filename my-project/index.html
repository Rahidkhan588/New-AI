<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkwell – poems and captions on any topic</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖋️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#150d2b; --bg2:#22134a; --ink:#f4efff; --muted:#a89cc8;
  --lilac:#b9a6ff; --mint:#7ef0c8; --pink:#ff5fa2;
  --mx:50%; --my:30%;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:'Outfit',system-ui,sans-serif;color:var(--ink);
  background:
    radial-gradient(500px circle at var(--mx) var(--my), rgba(185,166,255,.22), transparent 60%),
    linear-gradient(160deg,var(--bg),var(--bg2));
  background-attachment:fixed;
  overflow-x:hidden;
}
#trail{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:7vh 22px 60px;text-align:center}
h1{
  font-family:'Fraunces',serif;font-weight:700;font-size:clamp(2.2rem,7vw,4.2rem);
  line-height:1.1;letter-spacing:-.01em;margin-bottom:12px;cursor:default;
}
h1 .ch{display:inline-block;will-change:transform;transition:color .3s}
h1 .ch.hot{color:var(--mint)}
.sub{color:var(--muted);margin-bottom:34px;font-size:1.05rem}

.panel{
  background:rgba(255,255,255,.06);border:1px solid rgba(185,166,255,.25);
  border-radius:22px;padding:22px;backdrop-filter:blur(10px);
  transform-style:preserve-3d;transition:transform .15s ease-out;
}
input[type=text]{
  width:100%;padding:16px 18px;border-radius:14px;border:2px solid transparent;
  background:rgba(0,0,0,.35);color:var(--ink);font:inherit;font-size:1.15rem;outline:none;
  transition:border-color .2s, box-shadow .2s;
}
input[type=text]::placeholder{color:#7d71a0}
input[type=text]:focus{border-color:var(--lilac);box-shadow:0 0 0 6px rgba(185,166,255,.18)}

.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.chip{
  font:inherit;color:var(--ink);background:rgba(255,255,255,.07);
  border:1px solid rgba(185,166,255,.3);padding:9px 16px;border-radius:999px;cursor:pointer;
  transition:background .2s,border-color .2s,color .2s,transform .12s;will-change:transform;
}
.chip:hover{background:rgba(185,166,255,.2)}
.chip[aria-pressed=true]{background:var(--lilac);color:#20104a;border-color:var(--lilac);font-weight:600}
.seg .chip[aria-pressed=true]{background:var(--mint);border-color:var(--mint)}

.go{
  margin-top:22px;font:inherit;font-weight:600;font-size:1.1rem;color:#20104a;
  background:linear-gradient(90deg,var(--mint),var(--lilac),var(--pink));background-size:200% 100%;
  border:0;border-radius:16px;padding:15px 38px;cursor:pointer;position:relative;overflow:hidden;
  transition:background-position .6s,transform .12s;will-change:transform;
}
.go:hover{background-position:100% 0}
.go:active{transform:scale(.97)!important}
.go .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

#out{
  margin-top:28px;min-height:150px;text-align:left;padding:26px 28px;border-radius:22px;
  background:rgba(0,0,0,.35);border:1px solid rgba(126,240,200,.3);
  font-family:'Fraunces',serif;font-size:1.3rem;line-height:1.65;white-space:pre-wrap;
  position:relative;transition:transform .15s ease-out, box-shadow .3s;
}
#out.empty{color:#7d71a0;font-style:italic;display:grid;place-items:center;text-align:center}
#out.live{box-shadow:0 0 40px rgba(126,240,200,.15)}
.caret::after{content:"▍";color:var(--mint);animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tools{display:flex;gap:10px;justify-content:center;margin-top:14px;opacity:0;pointer-events:none;transition:opacity .3s}
.tools.on{opacity:1;pointer-events:auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:var(--mint);color:#20104a;padding:10px 20px;border-radius:12px;font-weight:600;transition:transform .3s;z-index:5}
.toast.on{transform:translate(-50%,0)}
:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="trail" aria-hidden="true"></canvas>
<main>
  <h1 id="title" aria-label="What should I write about?">What should I write about?</h1>
  <p class="sub">Type any topic. Pick a style. Get words back.</p>

  <section class="panel tilt">
    <input id="topic" type="text" maxlength="60" placeholder="e.g. monsoon rain, my best friend, Monday" autocomplete="off" aria-label="Topic">
    <div class="row seg" id="types">
      <button class="chip mag" aria-pressed="true" data-v="poem">Poem</button>
      <button class="chip mag" aria-pressed="false" data-v="caption">Caption</button>
    </div>
    <div class="row" id="tones">
      <button class="chip mag" aria-pressed="true" data-v="funny">Funny</button>
      <button class="chip mag" aria-pressed="false" data-v="romantic">Romantic</button>
      <button class="chip mag" aria-pressed="false" data-v="sad">Sad</button>
      <button class="chip mag" aria-pressed="false" data-v="motivational">Motivational</button>
    </div>
    <button class="go mag" id="go">Generate</button>
  </section>

  <div id="out" class="empty tilt">Your words will appear here.</div>
  <div class="tools" id="tools">
    <button class="chip mag" id="again">Write another</button>
    <button class="chip mag" id="copy">Copy</button>
  </div>
</main>
<div class="toast" id="toast">Copied</div>

<script>
/* ---------- CONFIG ----------
   Leave empty to use the built-in offline writer.
   Later, put your free serverless function URL here, e.g. "/api/generate".
   It must accept POST {topic,type,tone} and return {text:"..."} */
const API_URL = "/api/generate";

/* ---------- Offline writer ---------- */
const POEMS = {
  funny:[
    "{T} walked into my day uninvited,\nate my snacks, and left me excited.\nI asked it to go, it said \"maybe tomorrow,\"\nnow {t} and I share joy and sorrow.",
    "Roses are red, my phone is at nine,\n{t} took my time, and it's feeling fine.\nI planned to be serious, I really did try,\nbut {t} made me laugh until I could cry."
  ],
  romantic:[
    "In every quiet corner of my heart,\n{t} lives, a gentle work of art.\nYou turn the ordinary into gold,\na story only we two hold.",
    "If {t} were a song, I'd sing it slow,\nunder a sky where soft lights glow.\nEach little moment, tender and true,\nbrings me closer, always, to you."
  ],
  sad:[
    "{T} lingers where the light grows thin,\na hush that settles deep within.\nThe evening folds its wings and stays,\nand carries me through quiet days.",
    "I tried to hold {t} like a flame,\nbut it slipped softly, without a name.\nNow only echoes fill the air,\nand something sweet is lost somewhere."
  ],
  motivational:[
    "{T} is the mountain, you are the climb,\none step at a time, one hour at a time.\nThe doubt will whisper, let it be,\nthe strongest version of you is free.",
    "Rise with {t} before the dawn,\nthe hardest road leads on and on.\nYou were not built to fade or bend,\nthe best of you is still ahead, my friend."
  ]
};
const CAPS = {
  funny:[
    "Me and {t}: a toxic relationship I refuse to quit.",
    "Plot twist: {t} was the main character all along.",
    "{T} said \"trust me\" and I, a fool, did.",
    "Not saying {t} is my personality, but my friends are worried."
  ],
  romantic:[
    "{T} feels like home when I'm with you.",
    "Falling for {t}, one soft moment at a time.",
    "Some things are pure magic. {T} is one of them.",
    "You, me, and {t}. That's the whole story."
  ],
  sad:[
    "{T} hits different when the world goes quiet.",
    "Missing {t} in ways I can't explain.",
    "Some days, {t} is all the heart can hold.",
    "Smiling on the outside, thinking about {t}."
  ],
  motivational:[
    "{T} is just the beginning. Keep going.",
    "Build your life around {t} and watch it grow.",
    "Small steps toward {t} still count as progress.",
    "Your future self is already thankful for {t}."
  ]
};
let lastPick = "";
function localWrite(topic,type,tone){
  const list=(type==="poem"?POEMS:CAPS)[tone];
  let pick,tries=0;
  do{pick=list[Math.floor(Math.random()*list.length)];tries++}while(pick===lastPick&&tries<8);
  lastPick=pick;
  const t=topic.toLowerCase(), T=topic.charAt(0).toUpperCase()+topic.slice(1);
  return pick.replace(/\{T\}/g,T).replace(/\{t\}/g,t);
}
async function generate(topic,type,tone){
  if(API_URL){
    try{
      const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({topic,type,tone})});
      const d=await r.json();
      if(d&&d.text) return d.text;
    }catch(e){}
  }
  return localWrite(topic,type,tone);
}

/* ---------- UI state ---------- */
const $=s=>document.querySelector(s);
const out=$("#out"), tools=$("#tools"), topic=$("#topic");
let type="poem", tone="funny", typing=0;

function bindGroup(id,cb){
  $(id).addEventListener("click",e=>{
    const b=e.target.closest(".chip"); if(!b) return;
    $(id).querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));
    cb(b.dataset.v);
  });
}
bindGroup("#types",v=>type=v);
bindGroup("#tones",v=>tone=v);

async function run(){
  const t=topic.value.trim();
  if(!t){topic.focus();topic.animate([{transform:"translateX(0)"},{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"translateX(0)"}],{duration:250});return}
  const id=++typing;
  out.className="live caret"; out.textContent=""; tools.classList.remove("on");
  const text=await generate(t,type,tone);
  if(id!==typing) return;
  let i=0;
  (function step(){
    if(id!==typing) return;
    out.textContent=text.slice(0,++i);
    if(i<text.length) setTimeout(step,22);
    else{out.classList.remove("caret");tools.classList.add("on")}
  })();
}
$("#go").addEventListener("click",e=>{
  const b=e.currentTarget,r=b.getBoundingClientRect(),s=document.createElement("span");
  s.className="rip";const d=Math.max(r.width,r.height);
  s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  b.appendChild(s);setTimeout(()=>s.remove(),600);
  run();
});
$("#again").addEventListener("click",run);
topic.addEventListener("keydown",e=>{if(e.key==="Enter")run()});
$("#copy").addEventListener("click",async()=>{
  try{await navigator.clipboard.writeText(out.textContent)}catch(e){}
  const t=$("#toast");t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1400);
});

/* ---------- Mouse magic ---------- */
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
let mx=innerWidth/2,my=innerHeight/3;

// 1) Headline letters flee the cursor
const title=$("#title"), text=title.textContent;
title.textContent="";
const chars=[...text].map(c=>{
  const s=document.createElement("span");
  s.className="ch";s.setAttribute("aria-hidden","true");
  s.textContent=c===" "?"\u00A0":c;title.appendChild(s);return s;
});

// 2) Canvas ink trail
const cv=$("#trail"),cx=cv.getContext("2d");let parts=[],hue=260;
function size(){cv.width=innerWidth;cv.height=innerHeight}
size();addEventListener("resize",size);

addEventListener("mousemove",e=>{
  mx=e.clientX;my=e.clientY;
  document.body.style.setProperty("--mx",mx+"px");
  document.body.style.setProperty("--my",my+"px");
  if(reduce) return;
  hue=(hue+4)%360;
  for(let i=0;i<2;i++) parts.push({x:mx,y:my,vx:(Math.random()-.5)*1.6,vy:(Math.random()-.5)*1.6-.3,r:Math.random()*5+3,life:1,h:hue});
});

// 3) Magnetic buttons + 4) 3D tilt
const mags=[...document.querySelectorAll(".mag")], tilts=[...document.querySelectorAll(".tilt")];

function frame(){
  if(!reduce){
    chars.forEach(c=>{
      const r=c.getBoundingClientRect(),
            dx=r.left+r.width/2-mx, dy=r.top+r.height/2-my, d=Math.hypot(dx,dy), R=140;
      if(d<R){
        const f=(1-d/R)*38;
        c.style.transform=`translate(${dx/d*f}px,${dy/d*f}px) rotate(${dx/d*f*.6}deg) scale(${1+(1-d/R)*.35})`;
        c.classList.add("hot");
      }else{c.style.transform="";c.classList.remove("hot")}
    });
    mags.forEach(b=>{
      const r=b.getBoundingClientRect(),dx=mx-(r.left+r.width/2),dy=my-(r.top+r.height/2),d=Math.hypot(dx,dy);
      b.style.transform=d<110?`translate(${dx*.25}px,${dy*.25}px)`:"";
    });
    tilts.forEach(p=>{
      const r=p.getBoundingClientRect();
      if(mx>r.left&&mx<r.right&&my>r.top&&my<r.bottom){
        const nx=(mx-r.left)/r.width-.5, ny=(my-r.top)/r.height-.5;
        p.style.transform=`perspective(900px) rotateY(${nx*6}deg) rotateX(${-ny*6}deg)`;
      }else p.style.transform="";
    });
    cx.clearRect(0,0,cv.width,cv.height);
    parts=parts.filter(p=>p.life>0.02);
    parts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.life*=.94;
      cx.beginPath();cx.fillStyle=`hsla(${p.h},90%,72%,${p.life})`;
      cx.arc(p.x,p.y,p.r*p.life,0,6.283);cx.fill();
    });
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
